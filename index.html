<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Tunnel Runner PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #000;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            max-width: 100%;
            max-height: 100%;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 6px #00ff00;
            z-index: 10;
            display: flex;
            gap: 20px;
        }
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
            z-index: 20;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .btn-touch {
            width: 65px;
            height: 65px;
            background: rgba(0, 255, 0, 0.15);
            border: 2px solid #00ff00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ff00;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            backdrop-filter: blur(4px);
        }
        .btn-touch:active {
            background: rgba(0, 255, 0, 0.4);
            transform: scale(0.92);
        }
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.25);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-shadow: 0 0 10px #ff0000;
        }
        #game-over-overlay h1 {
            color: #ff0000;
            font-size: 42px;
            margin-bottom: 10px;
        }
        #game-over-overlay p {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 25px;
        }
        #btn-restart {
            padding: 12px 28px;
            background: #ff0000;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0000;
            font-family: inherit;
        }
        @media (min-width: 900px) {
            #touch-controls { display: none; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <div>TUNNEL RUNNER</div>
            <div>NIVEL: <span id="level">1</span></div>
            <div>SCORE: <span id="score">0</span></div>
            <div>VIDAS: <span id="lives">❤️❤️❤️</span></div>
        </div>
        
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        
        <div id="game-over-overlay">
            <h1>¡ZIZO TE ATRAPÓ!</h1>
            <p>El monstruo del túnel te ha devorado...</p>
            <button id="btn-restart" onclick="restartGame()">REINTENTAR</button>
        </div>

        <div id="touch-controls">
            <div class="control-group">
                <div class="btn-touch" id="btn-left">◀</div>
                <div class="btn-touch" id="btn-right">▶</div>
            </div>
            <div class="control-group">
                <div class="btn-touch" id="btn-up">▲</div>
                <div class="btn-touch" id="btn-down">▼</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
